<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding: 20px; background: var(--bg); display:flex; flex-direction:column; gap: 8px; }
  .row { display:flex; align-items:center; gap: 16px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); width: 50px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); width: 40px; text-align:right; }
  .bar { height: 12px; background: var(--signal-500); border-radius: 2px; }
</style>
</head>
<body>
  <div class="row"><div class="name">sp-1</div><div class="px">4</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">sp-2</div><div class="px">8</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">sp-3</div><div class="px">12</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">sp-4</div><div class="px">16</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">sp-6</div><div class="px">24</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">sp-8</div><div class="px">32</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">sp-12</div><div class="px">48</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">sp-16</div><div class="px">64</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">sp-24</div><div class="px">96</div><div class="bar" style="width:96px"></div></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion — easing & duration</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg); display:flex; flex-direction:column; gap:14px; }
  .lane { display:flex; align-items:center; gap: 14px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg); width: 90px; }
  .track { flex:1; height: 14px; background: var(--bg-sunken); border-radius: 999px; overflow:hidden; position:relative; }
  .ball { width: 14px; height: 14px; border-radius: 999px; background: var(--signal-500); position: absolute; left: 0; animation: m 2.4s infinite; }
  .a1 { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  .a2 { animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
  .a3 { animation-timing-function: linear; opacity: 0.4; }
  @keyframes m { 0%,12%{ left:0; } 50%,62% { left: calc(100% - 14px); } 100% { left:0; } }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); width: 90px; text-align:right; }
</style>
</head>
<body>
  <div class="lane"><span class="name">ease-out</span><div class="track"><div class="ball a1"></div></div><span class="meta">220ms · default</span></div>
  <div class="lane"><span class="name">ease-in-out</span><div class="track"><div class="ball a2"></div></div><span class="meta">420ms · slow</span></div>
  <div class="lane"><span class="name">linear</span><div class="track"><div class="ball a3"></div></div><span class="meta">avoid</span></div>
</body>
</html>

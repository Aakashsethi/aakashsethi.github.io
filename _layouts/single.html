<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Aakash Sethi</title>
<meta name="description" content="{{ page.excerpt | strip_html | truncate: 155 }}">
<meta name="author" content="Aakash Sethi">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 155 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="Aakash Sethi">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta property="article:author" content="Aakash Sethi">
{% for tag in page.tags %}
<meta property="article:tag" content="{{ tag }}">
{% endfor %}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.excerpt | strip_html | truncate: 155 }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": "Aakash Sethi",
    "url": "https://aakashsethi.github.io/"
  },
  "publisher": {
    "@type": "Person",
    "name": "Aakash Sethi",
    "url": "https://aakashsethi.github.io/"
  },
  "url": "{{ page.url | absolute_url }}",
  "keywords": {{ page.tags | join: ', ' | jsonify }}
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ '/' | absolute_url }}colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top bar ── */
  .post-topbar {
    background: var(--ink-950);
    border-bottom: 1px solid var(--ink-800);
    padding: 0 var(--sp-12);
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .post-wordmark {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink-50);
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .post-wordmark .wm-dot {
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--signal-500);
    border-radius: 999px;
    margin: 0 1px 2px;
    vertical-align: middle;
  }
  .post-back {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-400);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 120ms;
  }
  .post-back:hover { color: var(--signal-300); }

  /* ── Article ── */
  .post-wrap {
    max-width: 740px;
    margin: var(--sp-16) auto var(--sp-24);
    padding: 0 var(--sp-6);
  }
  .post-meta {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    flex-wrap: wrap;
    margin-bottom: var(--sp-6);
  }
  .post-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-muted);
    letter-spacing: 0.04em;
  }
  .post-tag {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--signal-700);
    background: var(--signal-50);
    border: 1px solid var(--signal-100);
    border-radius: 4px;
    padding: 2px 7px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .post-title {
    font-family: var(--font-sans);
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--fg);
    margin: 0 0 var(--sp-10);
  }
  .post-divider {
    border: 0;
    border-top: 1px solid var(--hairline);
    margin: var(--sp-8) 0;
  }

  /* ── Prose ── */
  .post-body {
    font-family: var(--font-reading);
    font-size: 17px;
    line-height: 1.75;
    color: var(--fg);
  }
  .post-body h2 {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: var(--sp-12) 0 var(--sp-4);
    color: var(--fg);
  }
  .post-body h3 {
    font-family: var(--font-sans);
    font-size: 17px;
    font-weight: 600;
    margin: var(--sp-8) 0 var(--sp-2);
    color: var(--fg);
  }
  .post-body p { margin: 0 0 var(--sp-5); }
  .post-body ul, .post-body ol {
    padding-left: 1.4em;
    margin: 0 0 var(--sp-5);
  }
  .post-body li { margin-bottom: var(--sp-2); }
  .post-body strong { font-weight: 700; color: var(--fg); }
  .post-body em { font-style: italic; }
  .post-body a {
    color: var(--signal-700);
    text-decoration: underline;
    text-decoration-color: var(--signal-300);
    transition: color 120ms;
  }
  .post-body a:hover { color: var(--signal-500); }
  .post-body blockquote {
    border-left: 3px solid var(--signal-500);
    padding: var(--sp-3) var(--sp-5);
    margin: var(--sp-6) 0;
    background: var(--bg-elev);
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: var(--fg-muted);
  }
  .post-body blockquote p { margin: 0; }
  .post-body pre {
    background: var(--ink-900);
    border: 1px solid var(--ink-700);
    border-radius: 10px;
    padding: var(--sp-5);
    overflow-x: auto;
    margin: var(--sp-5) 0;
  }
  .post-body code {
    font-family: var(--font-mono);
    font-size: 13.5px;
    color: var(--signal-300);
    background: var(--ink-900);
    border: 1px solid var(--ink-700);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .post-body pre code {
    background: transparent;
    border: 0;
    padding: 0;
    color: var(--ink-100);
    font-size: 13px;
    line-height: 1.6;
  }
  .post-body hr {
    border: 0;
    border-top: 1px solid var(--hairline);
    margin: var(--sp-10) 0;
  }

  /* ── Footer ── */
  .post-footer {
    margin-top: var(--sp-16);
    padding-top: var(--sp-8);
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--sp-4);
  }
  .post-footer-author {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-muted);
  }
  .post-footer-link {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--signal-700);
    text-decoration: none;
    border: 1px solid var(--signal-100);
    background: var(--signal-50);
    padding: var(--sp-2) var(--sp-4);
    border-radius: 999px;
    transition: background 120ms;
  }
  .post-footer-link:hover { background: var(--signal-100); }

  @media (max-width: 640px) {
    .post-topbar { padding: 0 var(--sp-5); }
    .post-wrap { margin-top: var(--sp-10); }
  }
</style>
</head>
<body>

<div class="post-topbar">
  <a class="post-wordmark" href="/">aakash<span class="wm-dot"></span>sethi</a>
  <a class="post-back" href="/">← back to home</a>
</div>

<article class="post-wrap">
  <div class="post-meta">
    <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
    {% for tag in page.tags limit:3 %}
    <span class="post-tag">{{ tag }}</span>
    {% endfor %}
  </div>

  <h1 class="post-title">{{ page.title }}</h1>
  <hr class="post-divider">

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-footer">
    <span class="post-footer-author">Written by Aakash Sethi · {{ page.date | date: "%Y" }}</span>
    <a class="post-footer-link" href="/#contact">Book a session →</a>
  </div>
</article>

</body>
</html>

services:
  - type: web
    name: portfolio-contact
    runtime: ruby
    buildCommand: bundle install
    startCommand: bundle exec ruby contact_server.rb
    envVars:
      - key: MAILTRAP_API_KEY
        sync: false
      - key: TO_EMAIL
        value: aakash.sethi7@gmail.com
      - key: FROM_EMAIL
        value: hello@tnufa.ai
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        value: https://portfolio-contact-j70g.onrender.com/auth/linkedin/callback
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: TRIGGER_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  # Cron jobs run as GitHub Actions (free) and POST to /internal/trigger.
  # See .github/workflows/linkedin-daily.yml and token-monitor.yml.
